name: syan

services:
  immich-server:
    container_name: syan_server
    image: syan-server:${SYAN_REVISION:?Set the source commit}
    ports: !reset []
    volumes:
      - syan-apks:/var/lib/syan/apks
      - syan-windows-storage:/mnt/syan-storage
      - syan-windows-library:/mnt/syan-library:ro
    networks:
      - default
      - proxy
    environment:
      IMMICH_ALLOW_SETUP: 'false'
      SYAN_STORAGE_TARGETS: >-
        [{"id":"default","name":"Server storage","path":"/data"},{"id":"windows-d","name":"Windows D storage","path":"/mnt/syan-storage"}]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:2283/api/server/ping').then((response) => response.json()).then((body) => process.exit(body.res === 'pong' ? 0 : 1)).catch(() => process.exit(1))
    labels:
      traefik.enable: '${SYAN_PUBLIC_ENABLED:-false}'
      traefik.docker.network: proxy
      traefik.http.routers.syan.rule: Host(`syan.sosdev.com.co`)
      traefik.http.routers.syan.entrypoints: web
      traefik.http.services.syan.loadbalancer.server.port: '2283'

  immich-machine-learning:
    container_name: syan_machine_learning
    image: syan-machine-learning:${SYAN_REVISION:?Set the source commit}
    env_file: !reset []

  redis:
    container_name: syan_redis

  database:
    container_name: syan_postgres
    env_file: !reset []

  immich-prometheus:
    container_name: syan_prometheus

  immich-grafana:
    container_name: syan_grafana

networks:
  proxy:
    external: true

volumes:
  syan-apks:
  syan-windows-storage:
    driver: local
    driver_opts:
      type: cifs
      o: >-
        addr=${SYAN_STORAGE_HOST:?Set the private Tailscale storage host},username=${SYAN_STORAGE_USERNAME:?Set the storage user},password=${SYAN_STORAGE_PASSWORD:?Set the storage password},vers=3.1.1,seal,uid=1000,gid=1000,file_mode=0660,dir_mode=0770,noserverino
      device: //${SYAN_STORAGE_HOST}/SYAN_STORAGE
  syan-windows-library:
    driver: local
    driver_opts:
      type: cifs
      o: >-
        addr=${SYAN_STORAGE_HOST:?Set the private Tailscale storage host},username=${SYAN_STORAGE_USERNAME:?Set the storage user},password=${SYAN_STORAGE_PASSWORD:?Set the storage password},vers=3.1.1,seal,uid=1000,gid=1000,file_mode=0440,dir_mode=0550,noserverino,ro
      device: //${SYAN_STORAGE_HOST}/SYAN_LIBRARY
